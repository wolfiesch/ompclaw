name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish OmpClaw
    if: github.repository == 'wolfiesch/ompclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require tag to match package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "ompclaw@$version" version >/dev/null 2>&1; then
            echo "ompclaw@$version is already published"
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
