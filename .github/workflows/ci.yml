name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lane: ${{ steps.policy.outputs.lane }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf 'base=\nhead=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          head="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          if [[ "$head" != "$PR_HEAD_SHA" ]]; then
            echo "pull-request head does not match event payload" >&2
            exit 1
          fi
          base="$(git merge-base "$PR_BASE_SHA" "$head")"
          {
            printf 'base=%s\n' "$base"
            printf 'head=%s\n' "$head"
          } >> "$GITHUB_OUTPUT"
      - name: Classify changes and scan public text
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf 'lane=full\nreason=main-push\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f .github/scripts/ci_policy.py ]]; then
            echo "::warning::CI policy is unavailable on the base revision; selecting the full lane without the public-text scan"
            printf 'lane=full\nreason=policy-unavailable\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci_policy.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  policy:
    name: ci-policy
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test CI policy
        run: python3 .github/scripts/test_ci_policy.py

  check:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ci

  workflow-lint:
    name: actionlint
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  verify:
    name: verify
    if: always()
    needs:
      - classify
      - policy
      - check
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      LANE: ${{ needs.classify.outputs.lane }}
      POLICY_RESULT: ${{ needs.policy.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
    steps:
      - name: Require the selected verification lane
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            echo "::error::CI classification did not succeed"
            exit 1
          fi
          case "$LANE" in
            fast)
              for result in "$POLICY_RESULT" "$CHECK_RESULT" "$WORKFLOW_LINT_RESULT"; do
                if [[ "$result" != skipped ]]; then
                  echo "::error::Fast-lane job unexpectedly resolved to $result"
                  exit 1
                fi
              done
              echo "Fast-lane classification and public-text scan succeeded"
              ;;
            full)
              for result in "$POLICY_RESULT" "$CHECK_RESULT" "$WORKFLOW_LINT_RESULT"; do
                if [[ "$result" != success ]]; then
                  echo "::error::Required full-lane job resolved to $result"
                  exit 1
                fi
              done
              echo "Full verification lane succeeded"
              ;;
            *)
              echo "::error::Unknown CI verification lane: ${LANE:-unset}"
              exit 1
              ;;
          esac
