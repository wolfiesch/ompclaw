name: Question
description: Ask about OmpClaw usage or configuration.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, access tokens, authorization headers, private paths, or personal data.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to accomplish, and where are you blocked?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Telegram
        - WebSocket
        - OMP session behavior
        - Automation
        - Memory and learning
        - Configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the OmpClaw version, platform, and redacted configuration relevant to the question.
